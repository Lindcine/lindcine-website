<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lucas Lindgren — cinematographer and filmmaker based in Stockholm, Sweden.">
  <meta name="theme-color" content="#08090a">
  <title>LINDCINE — Lucas Lindgren</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="#work" data-go="showreel">LINDCINE<span>®</span></a>
    <nav class="main-nav" aria-label="Main navigation">
      <button data-go="showreel">SHOWREEL</button>
      <button data-go="about">ABOUT</button>
      <button data-go="rightnow">RIGHT NOW</button>
      <button data-go="contact">CONTACT</button>
    </nav>
  </header>
  <main id="work" class="world-viewport" aria-label="LINDCINE visual portfolio">
    <div id="worldTrack" class="world-track"></div>
  </main>
  <div class="grain" aria-hidden="true"></div>
  <div class="project-modal" id="projectModal" aria-hidden="true">
    <div class="project-modal-backdrop" data-close-project></div>
    <section class="project-modal-dialog" role="dialog" aria-modal="true" aria-label="Project video player">
      <button class="project-modal-close" type="button" aria-label="Close video">×</button>
      <div class="project-modal-frame" id="projectModalFrame"></div>
      <div class="project-modal-caption">
        <span id="projectModalTitle"></span>
        <a id="projectModalLink" href="#" target="_blank" rel="noopener noreferrer">OPEN VIDEO ↗</a>
      </div>
    </section>
  </div>
  <div id="hoverNote" class="hover-note" aria-live="polite"><span></span><p></p></div>
  <script src="script.js"></script>
</body>
</html>
