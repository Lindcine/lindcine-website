<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lucas Lindgren — cinematographer and filmmaker based in Stockholm, Sweden.">
  <meta name="theme-color" content="#090a0b">
  <title>LINDCINE — Lucas Lindgren</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="world-loading">
  <div class="grain" aria-hidden="true"></div>
  <header class="site-header">
    <a class="wordmark" href="#work" data-nav="home" aria-label="LINDCINE home">LINDCINE<span>®</span></a>
    <nav class="main-nav" aria-label="Main navigation">
      <button type="button" data-nav="showreel">SHOWREEL</button>
      <button type="button" data-nav="about">ABOUT</button>
      <button type="button" data-nav="right-now">RIGHT NOW</button>
      <button type="button" data-nav="contact">CONTACT</button>
    </nav>
    <button class="menu-button" aria-label="Open menu" aria-expanded="false">MENU <span>＋</span></button>
  </header>

  <main class="world-main">
    <section class="work-page" id="work" aria-label="LINDCINE infinite visual archive">
      <div class="world-viewport" id="workViewport" tabindex="0" aria-label="Infinite horizontal visual archive. Use the mouse wheel, trackpad, touch, or arrow keys.">
        <div class="work-track" id="workGrid" aria-label="Projects, fragments and moments"></div>
      </div>
      <div class="hover-comment" id="hoverComment" aria-live="polite" aria-hidden="true">
        <span class="comment-kicker" id="commentKicker">A SMALL OBSERVATION</span>
        <p id="commentText"></p>
      </div>
    </section>
  </main>

  <dialog class="video-dialog" id="videoDialog" aria-label="Project video">
    <div class="dialog-toolbar">
      <span class="dialog-caption" id="dialogCaption"></span>
      <div class="dialog-actions">
        <button class="dialog-fullscreen" id="dialogFullscreen" aria-label="Enter fullscreen">FULLSCREEN ↗</button>
        <button class="dialog-close" aria-label="Close video">×</button>
      </div>
    </div>
    <div class="dialog-frame" id="dialogFrame"></div>
  </dialog>
  <script src="script.js"></script>
</body>
</html>
